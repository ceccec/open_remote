name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'app/**'
      - 'spec/**'
      - 'lib/tasks/docs_generator.rb'
      - 'config/initializers/rails_admin.rb'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_remote_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache root npm dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-root-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-root-

      - name: Cache docs npm dependencies
        uses: actions/cache@v5
        with:
          path: docs/node_modules
          key: ${{ runner.os }}-node-docs-${{ hashFiles('docs/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-docs-

      - name: Install root npm dependencies
        run: npm ci

      - name: Install docs npm dependencies
        working-directory: docs
        run: npm ci

      - name: Prepare VitePress cache directory
        run: |
          mkdir -p tmp/vitepress-cache

      - name: Set up database
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_remote_test
        run: |
          bundle exec rails db:create || echo "Database may already exist"
          bundle exec rails db:schema:load || bundle exec rails db:migrate || echo "Schema load/migrate completed or skipped"

      - name: Generate documentation from components and tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_remote_test
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: 'true'
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Generating documentation..."
          bundle exec rake docs:from_tests
          echo "Documentation generation completed"
          ls -la docs/.vitepress/ || echo "VitePress config directory not found"

      - name: Build VitePress documentation
        working-directory: docs
        env:
          VITE_CACHE_DIR: ../tmp/vitepress-cache
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: 'true'
        run: |
          echo "Building VitePress site..."
          echo "Cache directory: $VITE_CACHE_DIR"
          npm run build
          echo "Build completed"
          ls -la .vitepress/dist || echo "Build output directory not found"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
